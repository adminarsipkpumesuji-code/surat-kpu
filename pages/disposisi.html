<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<title>Redirect ke Lembar Disposisi — KPU Kab. Mesuji</title>
<script>
// Router untuk redirect ke lembar disposisi yang sesuai
(function(){
  // Cek login
  if(localStorage.getItem('kpu_logged_in')!=='true'){
    window.location.replace('../login.html');
    return;
  }

  // Ambil parameter dari URL
  const params = new URLSearchParams(window.location.search);
  const kodeSurat = params.get('kode');
  const jenis = params.get('jenis'); // 'ketua' atau 'sekretaris'

  if (!kodeSurat) {
    alert('Kode surat tidak ditemukan');
    window.history.back();
    return;
  }

  // Redirect ke print-disposisi.html dengan parameter
  window.location.replace(`print-disposisi.html?kode=${encodeURIComponent(kodeSurat)}&jenis=${jenis}`);
})();
</script>
</head>
<body style="margin:0;padding:40px;font-family:Arial,sans-serif;text-align:center;color:#666;">
  <div style="margin:60px auto;max-width:400px;">
    <div style="display:inline-block;width:40px;height:40px;border:4px solid #ddd;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <p style="margin-top:20px;font-size:14px;">Membuka lembar disposisi...</p>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
